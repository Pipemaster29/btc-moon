# Vigilância das carteiras da BTW, 24 horas por dia.
#
# A cadência não é arbitrária: os nós públicos da BSC só servem log da última
# hora, então rodar mais espaçado que isso deixa buracos em que uma
# transferência passa sem ser vista. Dez minutos dá seis leituras por janela,
# margem suficiente para o agendamento atrasar — o que acontece sob carga — sem
# nunca abrir buraco.
#
# Dez e não cinco porque cada ciclo faz cerca de cinquenta chamadas a nós
# públicos gratuitos: a cinco minutos seriam catorze mil por dia num endpoint
# sem contrato, e levar bloqueio por abuso pararia o monitor de vez, o que é
# muito pior do que atrasar um pouco.
#
# O custo é zero porque o repositório é público, e nesse caso o GitHub não
# cobra minutos de execução. Se ele voltar a ser privado, o teto de 2.000
# minutos mensais volta a valer e esta cadência custaria cerca de 18 dólares
# por mês — aí o certo é voltar para trinta minutos.

name: Radar BTW

on:
  schedule:
    - cron: "*/10 * * * *"
  # Permite disparar à mão pela aba Actions, para testar sem esperar.
  workflow_dispatch:

# Se um ciclo demorar, o próximo espera em vez de rodar em cima dele e gravar
# um estado inconsistente.
concurrency:
  group: radar-btw
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # A memória entre execuções vive no cache: o runner é descartado a cada
      # rodada, e sem o retrato anterior não existe comparação — só um estado
      # solto. A chave é rolante porque cache do GitHub é imutável: grava-se uma
      # nova a cada ciclo e restaura-se a mais recente pelo prefixo.
      - name: Restaurar memória
        uses: actions/cache/restore@v4
        with:
          path: .cache/monitor.json
          key: radar-btw-${{ github.run_id }}
          restore-keys: radar-btw-

      - run: npm ci

      - name: Rodar ciclo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run monitor

      - name: Guardar memória
        # Grava mesmo se o ciclo falhar no meio: perder o retrato faz o ciclo
        # seguinte virar "primeira leitura" e engolir os alertas daquela janela.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/monitor.json
          key: radar-btw-${{ github.run_id }}
