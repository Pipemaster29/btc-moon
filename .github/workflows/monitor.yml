# Vigilância das carteiras da BTW, 24 horas por dia.
#
# A cadência NÃO vem do agendamento do GitHub, e isso é deliberado: medido ao
# longo de dois dias, ele pede 10 minutos e entrega de 17 a 78. Numa moeda que
# se move 47% numa noite, 78 minutos de cegueira é inaceitável.
#
# Aqui o cron dispara duas vezes por hora e a cadência real vem de um laço
# interno que roda um ciclo a cada 3 minutos durante 35 minutos. Como as duas
# partidas se emendam pela fila de concorrência, não sobra intervalo morto entre
# elas — e uma partida atrasada pelo GitHub é coberta pela seguinte.
#
# Três minutos é o piso prático: cada ciclo faz cerca de cinquenta chamadas a
# nós públicos gratuitos, e apertar mais arrisca bloqueio por abuso — o que
# pararia o monitor de vez, muito pior do que atrasar um pouco.
#
# O custo é zero porque o repositório é público, e nesse caso o GitHub não cobra
# minutos de execução. Se ele voltar a ser privado, isto consumiria os 2.000
# minutos mensais em menos de dois dias — aí o certo é voltar ao cron simples.

name: Radar BTW

on:
  schedule:
    # De hora em hora, e cada execução se repete por dentro durante ~50 minutos.
    # O agendamento do GitHub é só o disparo; a cadência real vem do laço.
    # Duas partidas por hora, cada uma cobrindo 35 minutos. Com a fila de
    # concorrência elas se emendam em vez de se sobrepor, e uma partida atrasada
    # pelo GitHub é coberta pela outra — foi um intervalo morto de dez minutos
    # que deixou passar uma transferência de 2 milhões.
    - cron: "5,35 * * * *"
  # Permite disparar à mão pela aba Actions, para testar sem esperar.
  workflow_dispatch:

# Se um ciclo demorar, o próximo espera em vez de rodar em cima dele e gravar
# um estado inconsistente.
concurrency:
  group: radar-btw
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    # Escrita porque o retrato do panorama volta para o repositório. É o único
    # privilégio a mais que este workflow pede.
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # A memória entre execuções vive no cache: o runner é descartado a cada
      # rodada, e sem o retrato anterior não existe comparação — só um estado
      # solto. A chave é rolante porque cache do GitHub é imutável: grava-se uma
      # nova a cada ciclo e restaura-se a mais recente pelo prefixo.
      - name: Restaurar memória
        uses: actions/cache/restore@v4
        with:
          path: .cache/monitor.json
          key: radar-monitor-${{ github.run_id }}
          restore-keys: radar-monitor-

      - run: npm ci

      # O agendamento do GitHub não é confiável para vigilância: medido, ele pede
      # 10 minutos e entrega de 17 a 78. Numa moeda que se move 47% em uma noite,
      # 78 minutos de cegueira é inaceitável.
      #
      # A solução é parar de depender dele para a cadência: o cron só dispara a
      # execução, e o laço aqui dentro faz um ciclo a cada 3 minutos por 35
      # minutos. O atraso do agendamento passa a deslocar o início da janela, não
      # a abrir buraco dentro dela.
      #
      # Com o cron em 5,35 * * * * e 35 minutos de laço, as duas execuções da
      # hora se emendam com folga de 25 minutos para o atraso do agendamento.
      #
      # Uma falha de ciclo não derruba o laço — a rede pode oscilar, e perder um
      # ciclo é muito melhor do que perder a hora inteira.
      # Um retrato logo de cara: se a execução anterior falhou ou o agendador
      # pulou uma hora, isto reduz a idade do dado antes mesmo de o laço rodar.
      - name: Retrato de abertura
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          npm run panorama || exit 0
          # A carteira consome as linhas que o panorama acabou de gravar, então
          # vem depois dele e no mesmo commit. Falhar aqui não derruba o
          # retrato: ele é o dado, a carteira é a leitura em cima do dado.
          npm run carteira || echo "carteira falhou, seguindo"
          git add data/
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Retrato do panorama $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin HEAD:main || echo "abertura perdeu a corrida, o fechamento tenta de novo"

      - name: Vigiar por 35 minutos, um ciclo a cada 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          fim=$(( $(date +%s) + 35*60 ))
          n=0
          while [ "$(date +%s)" -lt "$fim" ]; do
            n=$((n+1))
            echo "=== ciclo $n · $(date -u +%H:%M:%S) UTC ==="
            npm run monitor || echo "ciclo $n falhou, seguindo"
            [ "$(date +%s)" -ge "$fim" ] && break
            sleep 180
          done
          echo "=== $n ciclos nesta execução ==="

      # ------------------------------------------------------------------
      # O retrato do panorama.
      #
      # Tirado DUAS vezes: uma ao começar e outra ao terminar o laço. O motivo é
      # medido — o cron pede duas execuções por hora e o GitHub entrega uma, com
      # atraso de zero a vinte e oito minutos. Com um retrato por execução, o
      # intervalo entre atualizações passava de hora e meia; com dois, cai pela
      # metade sem depender do agendador melhorar.
      #
      # A gravação SINCRONIZA ANTES DE GERAR, e essa ordem é o conserto de um bug
      # que perdia retratos em silêncio. A versão anterior gerava, commitava e só
      # então fazia `pull --rebase` — que conflitava em `data/panorama.json`,
      # porque o `merge=union` do `.gitattributes` só vale para o histórico
      # append-only, não para um retrato que é reescrito inteiro. Como as
      # execuções se sobrepõem por desenho, o rebase da segunda falhava nas três
      # tentativas e o retrato ia embora. Partindo do estado remoto, não há o que
      # rebasear: cada tentativa regenera em cima do que já está lá.
      - name: Tirar o retrato do panorama
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tentativa in 1 2 3; do
            git fetch --quiet origin main
            git checkout --quiet -B main origin/main

            npm run panorama || { echo "panorama falhou, seguindo"; exit 0; }
            npm run carteira || echo "carteira falhou, seguindo"
            # O garimpo peneira os 526 perpétuos da Binance atrás de moeda que
            # se pareça com o objeto de estudo, para a lista deixar de ser só o
            # que alguém lembrou de apontar. Roda SÓ no retrato de fechamento e
            # não no de abertura nem no laço de 3 minutos: são cerca de 570
            # requisições, e a coisa que ele procura leva dias para acontecer —
            # peneirar de três em três minutos gastaria orçamento da Binance
            # para reencontrar a mesma lista.
            npm run garimpar || echo "garimpo falhou, seguindo"

            git add data/
            if git diff --cached --quiet; then
              echo "nada mudou"
              exit 0
            fi

            git commit --quiet -m "Retrato do panorama $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push --quiet origin HEAD:main; then
              echo "retrato gravado na tentativa $tentativa"
              exit 0
            fi

            echo "corrida perdida na tentativa $tentativa, refazendo do zero"
            sleep $((tentativa * 5))
          done
          echo "não consegui gravar o retrato depois de três tentativas"

      - name: Guardar memória
        # Grava mesmo se o laço falhar no meio: perder o retrato faz o ciclo
        # seguinte virar "primeira leitura" e engolir os alertas daquela janela.
        #
        # Dentro da execução a memória vive em disco e passa de ciclo em ciclo
        # sem depender do cache; o cache só a carrega entre execuções.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/monitor.json
          key: radar-monitor-${{ github.run_id }}
