# Vigilância das carteiras da BTW, 24 horas por dia.
#
# A cadência NÃO vem do agendamento do GitHub, e isso é deliberado: medido ao
# longo de dois dias, ele pede 10 minutos e entrega de 17 a 78. Numa moeda que
# se move 47% numa noite, 78 minutos de cegueira é inaceitável.
#
# Aqui o cron dispara duas vezes por hora e a cadência real vem de um laço
# interno que roda um ciclo a cada 3 minutos durante 35 minutos. Como as duas
# partidas se emendam pela fila de concorrência, não sobra intervalo morto entre
# elas — e uma partida atrasada pelo GitHub é coberta pela seguinte.
#
# Três minutos é o piso prático: cada ciclo faz cerca de cinquenta chamadas a
# nós públicos gratuitos, e apertar mais arrisca bloqueio por abuso — o que
# pararia o monitor de vez, muito pior do que atrasar um pouco.
#
# O custo é zero porque o repositório é público, e nesse caso o GitHub não cobra
# minutos de execução. Se ele voltar a ser privado, isto consumiria os 2.000
# minutos mensais em menos de dois dias — aí o certo é voltar ao cron simples.

name: Radar BTW

on:
  schedule:
    # De hora em hora, e cada execução se repete por dentro durante ~50 minutos.
    # O agendamento do GitHub é só o disparo; a cadência real vem do laço.
    # Duas partidas por hora, cada uma cobrindo 35 minutos. Com a fila de
    # concorrência elas se emendam em vez de se sobrepor, e uma partida atrasada
    # pelo GitHub é coberta pela outra — foi um intervalo morto de dez minutos
    # que deixou passar uma transferência de 2 milhões.
    - cron: "5,35 * * * *"
  # Permite disparar à mão pela aba Actions, para testar sem esperar.
  workflow_dispatch:

# Se um ciclo demorar, o próximo espera em vez de rodar em cima dele e gravar
# um estado inconsistente.
concurrency:
  group: radar-btw
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # A memória entre execuções vive no cache: o runner é descartado a cada
      # rodada, e sem o retrato anterior não existe comparação — só um estado
      # solto. A chave é rolante porque cache do GitHub é imutável: grava-se uma
      # nova a cada ciclo e restaura-se a mais recente pelo prefixo.
      - name: Restaurar memória
        uses: actions/cache/restore@v4
        with:
          path: .cache/monitor.json
          key: radar-monitor-${{ github.run_id }}
          restore-keys: radar-monitor-

      - run: npm ci

      # O agendamento do GitHub não é confiável para vigilância: medido, ele pede
      # 10 minutos e entrega de 17 a 78. Numa moeda que se move 47% em uma noite,
      # 78 minutos de cegueira é inaceitável.
      #
      # A solução é parar de depender dele para a cadência: o cron só dispara a
      # execução, e o laço aqui dentro faz um ciclo a cada 3 minutos por 35
      # minutos. O atraso do agendamento passa a deslocar o início da janela, não
      # a abrir buraco dentro dela.
      #
      # Com o cron em 5,35 * * * * e 35 minutos de laço, as duas execuções da
      # hora se emendam com folga de 25 minutos para o atraso do agendamento.
      #
      # Uma falha de ciclo não derruba o laço — a rede pode oscilar, e perder um
      # ciclo é muito melhor do que perder a hora inteira.
      - name: Vigiar por 35 minutos, um ciclo a cada 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          fim=$(( $(date +%s) + 35*60 ))
          n=0
          while [ "$(date +%s)" -lt "$fim" ]; do
            n=$((n+1))
            echo "=== ciclo $n · $(date -u +%H:%M:%S) UTC ==="
            npm run monitor || echo "ciclo $n falhou, seguindo"
            [ "$(date +%s)" -ge "$fim" ] && break
            sleep 180
          done
          echo "=== $n ciclos nesta execução ==="

      - name: Guardar memória
        # Grava mesmo se o laço falhar no meio: perder o retrato faz o ciclo
        # seguinte virar "primeira leitura" e engolir os alertas daquela janela.
        #
        # Dentro da execução a memória vive em disco e passa de ciclo em ciclo
        # sem depender do cache; o cache só a carrega entre execuções.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/monitor.json
          key: radar-monitor-${{ github.run_id }}
